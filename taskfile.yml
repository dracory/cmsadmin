version: '3'

vars:
  APPNAME: cmsadmin

tasks:
  default:
    cmds:
      - echo "================================================================"
      - echo "=                                                              ="
      - echo "= Welcome to {{.APPNAME}}                                      ="
      - echo "=                                                              ="
      - echo "= Select an option from the list below                         ="
      - echo "=                                                              ="
      - echo "= 1. To run tests type 'task test'                             ="
      - echo "= 2. To run e2e tests type 'task e2e'                          ="
      - echo "= 3. To create coverage report type 'task cover'               ="
      - echo "=                                                              ="
      - echo "================================================================"
    silent: true

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  e2e:
    desc: Run end-to-end tests (headless Chrome via chromedp)
    cmds:
      - go test -v ./e2e/

  cover:
    desc: Builds a test coverage report
    cmds:
      - echo "Generating cover report..."
      - go test ./... -coverprofile=tmp/coverage.out -covermode=count
      - go tool cover -html=tmp/coverage.out
      - echo "Done!"
